<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>WeMEET - Home</title>
        <style>

            .div_menu_bar {
                margin:auto;
                padding:10px;

                border-style:solid;
                background-color:#1A1A19;
                width:98%;
            }

            body{
                background-color:#8FD14F;
            }
            h1 {
                display:inline;

                color:#31711E;
                font-size:60px;
                font-family: Eras ITC;
                margin-left: 10%;
            }
            .label{

            }
            .label_name {
                color: #FFE6A9;
                text-align: center;
                font-size: 30px;
                font-weight: bold;
                font-family: Perpetua;
                position: fixed;
                margin-top: 22.5px;
                right: 20%;
            }
            .button{
                transition-duration: 0.4s;
                cursor: pointer;
            }
            .button_profile {
                font-size:25px;
                font-family: Impact;
                color:#2A2A19;
                background-color: white;
                border-radius: 5px;
                padding: 10px;
                position: fixed;
                margin-top: 11.5px;
                right: 10%;
            }
            .button_profile:hover {
                background-color:#34A028;
            }

            .div_inputs_search {
                margin-top:25%;
                margin-bottom:30px;
                margin-left:5%;
                margin-right:5%;

                border-style:solid;
                border-radius:15px;

                padding:15px;

                background-color:#FFE6A9;
                text-align:center;

                font-size:25px;
                font-family: Perpetua;
            }
            .input{
                font-size:25px;
                font-family: Perpetua;
                transition-duration: 0.4s;
                cursor: text;
            }
            .input_params{
                border-style:none;
                border-radius:5px;
                background-color:#FFCF8D;
            }
            .input_params:hover{
                background-color:#DEAA79;
            }
            .label_space{
                font-size:35px;
                margin-left:5%;
                margin-right:5%;
            }

            .button_search {
                text-align:center;
                font-size:30px;
                font-family: Impact;
                color: white;
                background-color:#1A1A19;
                border-radius: 5px;
                padding: 10px;
                position:fixed;
                left: 45%;
                right: 45%;

            }
            .button_search:hover {
                background-color:#34A028;
            }
        </style>
    </head>

    <body>
        <div class="div_menu_bar">
            <h1>WeMEET</h1>
            <label class="label label_name">${ConnectedUser.Name} </label>
            <a class="button button_profile" href="@{Profile()}">PROFILE</a>
        </div>

        #{form @Home(), id:'formHome'}
        <div class="div_inputs_search">
            <label>Location:</label>
            <input id="loc" class="input input_params" type="text" name="location" value=""/>
            <label class="label label_space">|</label>
            <label>Date:</label>
            <input id="dat" class="input input_params" type="date" name="date" value=""/>
            <label class="label label_space">|</label>
            <label>People:</label>
            <input id="ppl" class="input input_params" type="text" name="people" value=""/>
        </div>
        <br>
        <button type="submit" id="search" class="button button_search" onclick="GoToSpaces()">SEARCH</button>

        <input style="display:none;" type="text" id="going_spaces" name="do_spaces"/>

        <script>
            function GoToSpaces() {
                var loc = document.getElementById("loc").value;
                var dat = document.getElementById("dat").value;
                var ppl = document.getElementById("ppl").value;
                if ((loc != "") && (dat != "") && (ppl != ""))
                {
                    document.getElementById("going_spaces").value = "true";
                }
            }

        </script>

        #{/form}
    </body>
</html>
