<!DOCTYPE html>
<html lang="en">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<head>
    <meta charset="UTF-8">
    <title>Espacios disponibles</title>
</head>
<body>
#{if spaceses}
<div class="container-xxl text-center mt-5">
    <h2 class="text-center">Lista de espacios disponibles para alquilar</h2>
    <table class="table">
        <tr>
            <th scope="col">Capacidad</th>
            <th scope="col">Horario disponible</th>
            <th scope="col">Localización</th>
            <th scope="col">Ventilación</th>
        </tr>
        #{list spaceses, as:'s'}
        <tr>
            <td>${s.numberPeople}</td>
            <td>${s.scheduleAvailable}</td>
            <td>${s.location}</td>
            <td>${s.ventilation}</td>
        </tr>
        #{/list}
    </table>
</div>
#{/if}
#{else}
<h3>No hay espacios disponibles para alquilar</h3>
#{/else}
</body>
</html>
