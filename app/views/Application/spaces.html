<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>WeMEET - Spaces</title>

        <style>
            .div_menu_bar {
                margin:auto;
                padding:10px;

                border-style:solid;
                background-color:#1A1A19;
                width:98%;
            }
            body{
                background-color:#8FD14F;
            }
            h1 {
                display:inline;
                text-transform: capitalize;
                color:#31711E;
                font-size:60px;
                font-family: Impact;
                margin-left: 10%;
                text-transform: capitalize;
            }
            .button_to_home {
                background-color:#F6FCDF;
                text-align:center;

                transition-duration: 0.4s;

                font-size:25px;
                font-family: Impact;
                color:#2A2A19;
                border-radius: 5px;
                padding: 10px;
                position: fixed;
                margin-top: 11.5px;
                right: 10%;
            }
            .button_to_home:hover {
                background-color:#34A028;
                cursor: pointer;
            }

            /*Container que permet fer scroll*/
            .div_container{
                overflow: auto;
                position:fixed;
                left: 50%;
                right: 0.7%;
                top: 15%;
                bottom: 1%;

                border-style: solid;
            }

            /*Anunci de cada un dels spaces*/
            .div_space_cover{
                border-style: solid;
                background-color: #FFE6A9;

                position: relative;
                left: 10%;
                right: 30%;
                padding: 0px;
                margin-top:15%;
                height: 125px;
            }
            .div_space_cover:hover {
                cursor: pointer;
            }
            .div_border{
                border-style: solid;
                background-color: #8FD14F;

                position: absolute;
                left: 120px;
                height: 121px;
                width: 0px;
            }
            .div_picture{
                position: absolute;
                width:120px;
                height: 125px;
            }
            .label_location_space{
                position: absolute;
                left: 150px;
                top: 25px;
            }
            .label_date_space{
                position: absolute;
                left: 150px;
                top: 75px;
            }
            .label_people_space{
                position: absolute;
                left: 325px;
                top: 75px;
            }

            /*Barra dels resultats de la busqueda*/
            .div_inputs_search {
                position:fixed;
                margin-top:2%;
                left:55%;
                right:10%;
                z-index: 2;

                border-style:solid;
                border-radius:15px;

                padding:15px;

                background-color:#FFE6A9;
                text-align:center;

                font-size:25px;
                font-family: Perpetua;
            }
            /*Millor display del scroll. Fa que desapareixi al passar per sota la barra de busqueda*/
            .div_top_scroll_invisible{
                position:fixed;
                background-color: #8FD14F;
                left: 55%;
                right: 10%;
                top: 15.4%;
                bottom: 75%;
                z-index: 2;
            }

            /*Disseny taula que conte els anuncis dels spaces*/
            .table_containers{
                border: 3px solid black;
                width: 58%;

                position: absolute;
                left: 15%;
                right: 25%;
                padding: 0px;
                margin-top:15%;
                height: 125px;
            }

            /* SCROLLBAR */
            /* width */
            ::-webkit-scrollbar {
                width: 10px;
            }

            /* Track */
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            /* Handle */
            ::-webkit-scrollbar-thumb {
                background: #888;
            }

            /* Handle on hover */
            ::-webkit-scrollbar-thumb:hover {
                background: #555;
            }

            /*Quan es clica un anunci, mostrem la info*/
            .div_space_clicked{
                position:fixed;
                right: 67%;
                left: 2.7%;
                top: 20%;
                bottom: 35%;

                background-color: #1A1A19;

                border-style: solid;
            }
            .div_space_clicked_picture{
                position: absolute;
                background-color: red;
                width: 100%;
                height: 70%;
            }
            .div_space_clicked_label{
                position: absolute;
                color: white;
            }

             /* Decoration */
            .div_deco{
                position:fixed;
                right: 65%;
                left: 0.7%;
                top: 15%;
                bottom: 1%;

                border-style: solid;
            }
            .label_typo1{
                font-size:20px;
                font-family: Impact;
            }

            .label_typo2{
                font-size:15px;
                font-family: Impact;
            }

            .button_schedule{
                background-color:#B1F0F7;
                text-align:center;

                transition-duration: 0.4s;

                font-size:35px;
                color: #1A1A19;
                font-family: Impact;
                border-radius: 5px;
                width: 40px;

            }
            .button_schedule:hover {
                background-color:#34A028;
                cursor: pointer;
            }

            .div_space_clicked_schedule{
                position:fixed;
                right: 72%;
                left: 7.7%;
                top: 70%;
                bottom: 15%;

                background-color: #1A1A19;
                border-style: solid;
            }

            .input_hours{
                position: absolute;

                font-size:15px;
                font-family: Perpetua;
                transition-duration: 0.4s;
                cursor: text;
                width: 15px;
                height: 15px;
            }

            .button_RESERVE{
                background-color:#34A028;
                text-align:center;

                transition-duration: 0.4s;

                font-size:25px;
                color: #1A1A19;
                font-family: Impact;
                border-radius: 5px;
                padding: 5px;
            }
            .button_RESERVE:hover {
                background-color:#B1F0F7;
                cursor: pointer;
            }


        </style>
    </head>

    <body >
        <div class="div_menu_bar">
            <h1>Spaces</h1>

            <a class="button_to_home" href="@{Home()}">HOME</a>
        </div>

        <div class="div_deco">
            <img src="@{'public/images/Shield_Water.jpg'}" alt="Icon" style="width:100%;height:100%;">
        </div>

        #{form @Spaces(), id:'formSpacesClicked'}
            <div class="div_space_clicked" id="show_space" style="display:none;">
                <div   id="pic_clicked_show" class="div_space_clicked_picture"
                       style="background-size: contain; background-repeat: no-repeat; background-position: center;">
                </div>
                <label id="loc_clicked_show" class="label_typo2 div_space_clicked_label" style="left: 5%; top: 73%;">a</label>
                <label id="dat_clicked_show" class="label_typo2 div_space_clicked_label" style="left: 5%; top: 83%;">a</label>
                <label id="ppl_clicked_show" class="label_typo2 div_space_clicked_label" style="left: 5%; top: 93%;">a</label>
                <label class="label_typo2 div_space_clicked_label" style="left: 30%; top: 73%;">Schedule:______h</label>
                <label id="hav_clicked_show" class="label_typo2 div_space_clicked_label" style="left: 45%; top: 73%;">a</label>
                <label class="button_schedule div_space_clicked_label" style="left: 40%; top: 83%;"
                       onpointerover="ShowSchedule()">+</label>

                <label class="label_typo2 div_space_clicked_label" style="left: 65%; top: 73%;">Start:</label>
                <input id="START" class="input_hours" type="text" name="hour_start" style="left: 73%; top: 73%;"/>
                <label class="label_typo2 div_space_clicked_label" style="left: 84%; top: 73%;">End:</label>
                <input id="END" class="input_hours" type="text" name="hour_end" style="left: 90%; top: 73%;"/>

                <label id="ide_clicked_show" style="display: none;"></label>

                <button type="submit" class="button_RESERVE div_space_clicked_label" style="left: 70%; top: 83%;"
                        onclick="CreateReserve(event)">CREATE</button>

                <input style="display:none;" type="text" id="creating_bool" name="do_reserve"/>
                <input style="display:none;" type="text" id="creating_id" name="id"/>
                <input style="display:none;" type="text" id="creating_new_schedule" name="new_schedule"/>
                <input style="display:none;" type="text" id="creating_schedule_meeting" name="schedule_meeting"/>
                <input style="display:none;" type="text" id="creating_people" name="number_people"/>

                <div id="schedule_clicked" class="div_space_clicked_schedule" style="display: none;">
                    <label class="label_typo2 div_space_clicked_label" style="left: 5%; top: 10%;">HOURS TAKEN:</label>
                    <label id="tkn_clicked_show" class="label_typo2 div_space_clicked_label" style="left: 10%; top: 30%;">a</label>
                </div>

                <label class="label_typo1" id="check_hours" style="color: red; display:none; left: 27%; top: 90%;">Check the selected hours</label>
            </div>
        #{/form}

        <div class="div_container">
            <div class="div_scroll">
                <div class="div_top_scroll_invisible">
                    <div class="div_inputs_search">
                        <label class="label_typo1" style="margin-right:10%;">${location}</label>
                        <label class="label_typo1">${date}</label>
                        <label class="label_typo1" style="margin-left:10%;">${people} PEOPLE</label>
                        <label id="num_people_search" style="display:none;">${people}</label>
                    </div>
                </div>

                #{form @Spaces(), id:'formSpaces'}
                    #{if list_of_spaces}
                        <table class="table_containers">
                            <tr>
                                <th></th>
                            </tr>

                            #{list items:list_of_spaces, as:'space'}
                                <tr style="border: 1px solid black  ;">
                                    <td >
                                        <div id="${space.id}" class="div_space_cover" onclick="ShowSpace(this.id)">
                                            <div    class="div_border"></div>
                                            <div    id="${space.id} pic" class="div_picture" about="url(${space.imagepath});"
                                                    style="background: url(${space.imagepath}); background-size: cover;
                                                    background-repeat: no-repeat; background-position: center; ">
                                            </div>
                                            <label  id="${space.id} loc" class="label_typo1 label_location_space">${space.location}</label>
                                            <label  id="${space.id} dat" class="label_typo1 label_date_space">${space.date}</label>
                                            <label  id="${space.id} ppl" class="label_typo1 label_people_space">${space.numberPeople} PEOPLE</label>
                                            <label  id="${space.id} hav" style="display: none;">${space.schedule_start} - ${space.schedule_end}</label>
                                            <label  id="${space.id} tkn" style="display: none;">${space.schedule}</label>
                                            <label  id="${space.id} ide" style="display: none;">${space.iden}</label>
                                        </div>
                                    </td>
                                </tr>
                            #{/list}
                        </table>


                    #{/if}
                #{/form}



                <!--
                    scrollbar   https://www.w3schools.com/howto/howto_css_custom_scrollbar.asp
                    event click id  https://stackoverflow.com/questions/4825295/onclick-to-get-the-id-of-the-clicked-button
                -->
            </div>
        </div>

        <script>

            function ShowSpace(clicked_id){
                var clicked = document.getElementById("show_space");
                if(clicked.style.display == "none")
                {
                    document.getElementById("show_space").style.display = "inline";

                    var clicked_pic = document.getElementById(clicked_id + " pic").style.background;
                    var clicked_loc = document.getElementById(clicked_id + " loc").innerHTML;
                    var clicked_dat = document.getElementById(clicked_id + " dat").innerHTML;
                    var clicked_ppl = document.getElementById(clicked_id + " ppl").innerHTML;
                    var clicked_hav = document.getElementById(clicked_id + " hav").innerHTML;
                    var clicked_tkn = document.getElementById(clicked_id + " tkn").innerHTML;
                    var clicked_ide = document.getElementById(clicked_id + " ide").innerHTML;
                    document.getElementById("pic_clicked_show").style.background = clicked_pic;
                    document.getElementById("loc_clicked_show").innerHTML = clicked_loc;
                    document.getElementById("dat_clicked_show").innerHTML = clicked_dat;
                    document.getElementById("ppl_clicked_show").innerHTML = clicked_ppl;
                    document.getElementById("hav_clicked_show").innerHTML = clicked_hav;
                    document.getElementById("tkn_clicked_show").innerHTML = clicked_tkn;
                    document.getElementById("ide_clicked_show").innerHTML = clicked_ide;

                    document.getElementById("creating_id").value = clicked_ide;
                    var people = document.getElementById("num_people_search").innerHTML;
                    document.getElementById("creating_people").value = people;
                }
                else
                {
                    document.getElementById("show_space").style.display = "none";
                }
            }

            function ShowSchedule(){
                var state = document.getElementById("schedule_clicked").style.display;

                if(state == "inline"){
                    document.getElementById("schedule_clicked").style.display = "none";
                }
                else{
                    document.getElementById("schedule_clicked").style.display = "inline";
                }
            }

            function CreateReserve(event){

                var range_hours = document.getElementById("hav_clicked_show").innerHTML;
                let schedule_range = range_hours.split("-").map(Number);
                var min_hour = schedule_range[0];
                var max_hour = schedule_range[1];

                var hour_start = document.getElementById("START").value;
                var hour_end = document.getElementById("END").value;

                var a = parseFloat(hour_start);
                var b = parseFloat(hour_end);

                if ((a < b) && (a >= min_hour) && (b <= max_hour))
                {
                    var taken_hours = document.getElementById("tkn_clicked_show").innerHTML;
                    let hour_range = taken_hours.split(" ");
                    let i = 0;
                    let found = 0;

                    let pos1 = 0;
                    let pos2 = 0;
                    while ((i < hour_range.length) && (found === 0)) {
                        let hours = hour_range[i].split("-").map(Number);

                        if ((hour_end <= hours[0]) && (hour_start >= min_hour)) {
                            pos2 = hours[0];
                        } else if ((hour_start >= hours[1]) && (hour_end <= max_hour)) {
                            pos1 = hours[1];
                        }

                        if ((hour_start >= hours[0]) && (hour_start <= hours[1]) && (hour_end >= hours[0]) && (hour_end <= hours[1])) {
                            found = 2;
                        } else if ((hour_start <= hours[0]) && (hour_end >= hours[1])) {
                            found = 2;
                        } else {
                            if ((pos1 !== 0) && (pos2 !== 0)) {
                                found = 1;
                            } else {
                                i++;
                            }
                        }
                    }
                    let final = "";

                    if (found === 1) {
                        let j = 0;
                        while (j < hour_range.length - 1) {
                            if (j === i) {
                                final += hour_start + "-" + hour_end + " ";
                            }

                            final += hour_range[j] + " ";
                            j++;
                        }
                        if (i === hour_range.length - 1){
                            final += hour_start + "-" + hour_end + " ";
                        }
                        final += hour_range[j];

                        document.getElementById("creating_new_schedule").value = final;
                        document.getElementById("creating_schedule_meeting").value = hour_start + "-" + hour_end;
                        document.getElementById("creating_bool").value = "true";

                    } else if (found === 0) {
                        if (pos1 === 0) {
                            pos1 = min_hour;
                            if(taken_hours == "null"){
                                final = hour_start + "-" + hour_end;
                            }
                            else{
                                final = hour_start + "-" + hour_end + " " + taken_hours;
                            }
                        } else if (pos2 === 0) {
                            pos2 = max_hour;
                            if(taken_hours == "null"){
                                final = hour_start + "-" + hour_end;
                            }
                            else{
                                final = taken_hours + " " + hour_start + "-" + hour_end;
                            }
                        }
                        document.getElementById("creating_new_schedule").value = final;
                        document.getElementById("creating_schedule_meeting").value = hour_start + "-" + hour_end;
                        document.getElementById("creating_bool").value = "true";

                    } else if (found === 2) {
                        document.getElementById("check_hours").style.display = "block";
                        event.preventDefault();
                    }
                }
                else{
                    document.getElementById("check_hours").style.display = "block";
                    event.preventDefault();
                }
            }

        </script>
    </body>
</html>
