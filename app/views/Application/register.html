<html lang="en">
    <head>
        <title>WeMEET - Register</title>
        <style>
            body{
                background-color:#8FD14F;
            }
            h1 {
                margin-top: 150px;
                color: #31711E;
                text-align: center;
                font-size: 60px;
                font-family: Impact;
            }
            label1 {
                color: #31711E;
                text-align: center;
                font-size: 22px;
                font-family: Perpetua;
                margin-right: 15px;
            }
            input{
                background-color:#8FD14F;
                border-top-style: hidden;
                border-left-style: hidden;
                border-right-style: hidden;
                outline: none;
                font-family: Perpetua;
                font-size: 20px;
                text-align: center;
            }
            button{
                border-radius: 8px;
                font-family: Perpetua;
                font-size: 18px;
                font-weight: bold;
                text-align: center;
                background-color:#85BF3D;
                width: 100px;
                height: 30px;
            }
        </style>
    </head>

    <body onload="Retry(${error})">
        <h1>REGISTER</h1>

        #{form @Register(), id:'formRegister'}
        <p style="margin-left:42.7%; margin-bottom:30px;">
            <label1>Name:</label1>
            <input type="text" name="n" id="1"/>
        </p>
        <p style="margin-left:42.7%;">
            <label1>Password:</label1>
            <input type="password" name="p" id="2"/>
        </p>
        <br>
        <p style="margin-left:42.7%;">
            <button type="submit" id="3">DONE</button>
        </p>
        <br>
        <p>
            <label1 id="4" style="display:none; margin-left:45.5%; margin-top:30px; color:red;">User already exists</label1>
        </p>

        <script>
            function Retry(x){
                if(x == 1){
                    document.getElementById("4").style.display = "inline";
                }
            }
        </script>
        #{/form}

    </body>
</html>
