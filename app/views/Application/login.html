#{extends 'main.html' /}
#{set title:'Home' /}

<h1>Login</h1>

#{form @Login(), id:'formLogin'}
    <p class="field">
        <label>Login Name:</label>
        <input type="text" name="n" size="19" value="${flash.username}" />
    </p>
    <p class="field">
        <label>Password:</label>
        <input type="password" name="p" size="19"/>
    </p>
    <p class="buttons">
        <input type="submit" value="Account login" />
    </p>
#{/form}
