<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WeMEET - Login</title>
    <style>
        body {
            background-color: #8FD14F;
        }
        h1 {
            margin-top: 150px;
            color: #31711E;
            text-align: center;
            font-size: 60px;
            font-family: Impact;
        }
        label {
            color: #31711E;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            font-family: Perpetua;
            margin-right: 15px;
        }
        input {
            background-color: #8FD14F;
            border-top-style: hidden;
            border-left-style: hidden;
            border-right-style: hidden;
            outline: none;
            font-family: Perpetua;
            font-size: 20px;
            text-align: center;
        }
        button {
            border-radius: 8px;
            font-family: Perpetua;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background-color: #85BF3D;
            width: 100px;
            height: 30px;
        }
    </style>
</head>

<body onload="Retry(${times})">
<h1>LOGIN</h1>

#{form @Login(), id:'formLogin'}
<p style="margin-left:45.5%; margin-bottom:30px;">
    <label>Name:</label>
    <input type="text" id="1" name="n" />
</p>
<p style="margin-left:45.5%;">
    <label>Password:</label>
    <input type="password" id="2" name="p" style="width: 176px;" />
</p>
<br>
<p style="margin-left:45.5%;">
    <button type="submit" id="3">DONE</button>
</p>
<br>
<p>
    <label id="4" style="display:none; margin-left:45.5%; margin-top:30px; color:red;">
        Incorrect Username or Password
    </label>
</p>

<script>
    function Retry(times) {
        if (times === 1) {
            document.getElementById("4").style.display = "inline";
        } else {
            document.getElementById("4").style.display = "none";
        }
    }
</script>
#{/form}

</body>
</html>
