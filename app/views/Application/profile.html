<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WeMEET - Profile</title>
    <style>

        .div_menu_bar {
            margin:auto;
            padding:10px;

            border-style:solid;
            background-color:#1A1A19;
            width:98%;
        }

        body{
            background-color:#8FD14F;
        }
        h1 {
            display:inline;
            text-transform: capitalize;
            color:#31711E;
            font-size:60px;
            font-family: Impact;
            margin-left: 10%;
            text-transform: capitalize;
        }

        .button_to_home {
            background-color:#F6FCDF;
            text-align:center;

            transition-duration: 0.4s;
            cursor: pointer;
            font-size:25px;
            font-family: Impact;
            color:#2A2A19;
            border-radius: 5px;
            padding: 10px;
            position: fixed;
            margin-top: 11.5px;
            right: 10%;
        }
        .button_to_home:hover {
            background-color:#34A028;
        }

        .div_black {
            position: absolute;
            top: 20%;
            bottom:10%;
            left:0.7%;
            right:60%;

            border-style:solid;
            border-top:none;

            padding:50px;

            background-color:#1A1A19;
            text-align:center;

            font-size:25px;
            font-family: Perpetua;
        }
        .div_options {
            position: absolute;
            top: 10%;
            bottom:10%;
            left:27%;
            right:10%;

            border-style:solid;
            border-top:none;

            padding:50px;

            background-color: #8FD14F;
            text-align:center;

            font-size:25px;
            font-family: Perpetua;
        }
        .button_options {
            position:absolute;

            left:15%;
            right:15%;

            background-color:#31711E;
            text-align:center;
            font-size:20px;
            font-family: Impact;

            transition-duration: 0.4s;
            cursor: pointer;

            color:#2A2A19;
            border-radius: 5px;
            padding: 15px;
        }
        .button_options:hover {
            background-color:#34A028;
        }

        .div_stats {
            position: absolute;
            top: 20%;
            bottom:10%;
            left:42.5%;
            right:37.5%;

            border-style:solid;
            padding:50px;

            background-color: #31711E;
            text-align:center;
        }

        .div_label_stats{
            background-color:#8FD14F;
            height:25px;
            border-radius: 5px;

            position:absolute;
            left:10%;
            right:50%;
        }

        .label_params{
            font-size:20px;
            font-family: Impact;
            color: #1A1A19;

            position:absolute;
            left:52.5%;
        }

        .label_stats{
            font-size:15px;
            font-family: Impact;
            position:absolute;
            top:4px;
            left:10px;
        }

        .button_show_spaces{
            background-color:#8FD14F;
            text-align:center;

            position:absolute;
            left:20%;
            right:20%;
            padding: 10px;

            transition-duration: 0.4s;

            font-size:20px;
            color: #1A1A19;
            font-family: Impact;
            border-radius: 5px;
        }
        .button_show_spaces:hover {
            background-color:#34A028;
            cursor: pointer;
        }




        /* FORMS - SUBMITS*/

        .question {
            font-size:20px;
            font-family: Impact;
        }
        .input_password{
            font-size:20px;
            font-family: Perpetua;
            background-color:#8FD14F;
            border-style:none;
            border-bottom-style: solid;
            text-align: center;
            outline: none;
        }

        /* Set a style for the submit/login button */
        .btn {
          background-color: #04AA6D;
          color: white;
          padding: 16px 20px;
          border: none;
          cursor: pointer;
          width: 75%;
          margin-top:15px;
          opacity: 0.8;
        }

        /* Add a red background color to the cancel button */
        .cancel {
            margin-top:15px;
            background-color: red;
        }

        /* Add some hover effects to buttons */
        .btn:hover, .open-button:hover {
          opacity: 1;
        }


        /*FORM CHANGE PASSWORD*/

        .form-popup_PASSWORD {
          display: none;

          position: fixed;
          top:20%;
          bottom: 40%;
          right: 10%;
          left: 65%;
          padding: 15px;

          text-align:center;

          border: 3px solid #f1f1f1;
          z-index: 9;
        }

        /* Add styles to the form container */
        .form-container_PASSWORD {
          max-width: 300px;
          padding: 10px;
        }

        /* Full-width input fields */
        .form-container_PASSWORD input[type=text], .form-container_DELETE input[type=password] {
          width: 100%;
          padding: 15px;
          margin: 5px 0 22px 0;
          border: none;
          background: #f1f1f1;
        }

        /* When the inputs get focus, do something */
        .form-container_PASSWORD input[type=text]:focus, .form-container_PASSWORD input[type=password]:focus {
          background-color: #ddd;
          outline: none;
        }


        /*FORM DELETE*/

        .form-popup_DELETE {
          display: none;

          position: fixed;
          top:20%;
          bottom: 50%;
          right: 10%;
          left: 65%;
          padding: 15px;

          text-align:center;

          border: 3px solid #f1f1f1;
          z-index: 9;
        }

        /* Add styles to the form container */
        .form-container_DELETE {
          max-width: 300px;
          padding: 10px;
        }

        /* Full-width input fields */
        .form-container_DELETE input[type=text], .form-container_DELETE input[type=password] {
          width: 100%;
          padding: 15px;
          margin: 5px 0 22px 0;
          border: none;
          background: #f1f1f1;
        }

        /* When the inputs get focus, do something */
        .form-container_DELETE input[type=text]:focus, .form-container_DELETE input[type=password]:focus {
          background-color: #ddd;
          outline: none;
        }

        /* FORMS SHOW SPACES RENTED */

        /*Container que permet fer scroll*/
            .div_container{
                display:none;
                overflow: auto;
                position:fixed;
                left: 65%;
                right: 0.7%;
                top: 20%;
                bottom: 10%;

                border-style: solid;
            }

            /*Anunci de cada un dels spaces*/
            .div_space_cover{
                border-style: solid;
                background-color: #FFE6A9;

                position: relative;
                left: 10%;
                width: 80%;
                padding: 0px;
                margin-top:15%;
                height: 125px;
            }
            .div_border{
                border-style: solid;
                background-color: #8FD14F;

                position: absolute;
                left: 120px;
                height: 121px;
                width: 0px;
            }
            .div_picture{
                position: absolute;
                width:120px;
                height: 125px;
            }
            .label_location_space{
                position: absolute;
                left: 150px;
                top: 25px;
            }
            .label_date_space{
                position: absolute;
                left: 150px;
                top: 75px;
            }
            .label_people_space{
                position: absolute;
                left: 250px;
                top: 75px;
            }

            /*Disseny taula que conte els anuncis dels spaces*/
            .table_containers{
                border: 3px solid black;
                width:90%;
                position: absolute;
                top:5%;
                left: 5%;
            }

            /* SCROLLBAR */
            /* width */
            ::-webkit-scrollbar {
                width: 10px;
            }

            /* Track */
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            /* Handle */
            ::-webkit-scrollbar-thumb {
                background: #888;
            }

            /* Handle on hover */
            ::-webkit-scrollbar-thumb:hover {
                background: #555;
            }

            /*Barra dels resultats de la busqueda*/
            .div_inputs_search {
                position:absolute;
                top:20%;
                left:10%;
                right:10%;
                z-index: 2;

                border-style:solid;
                border-radius:15px;

                padding:10px;

                background-color:#FFE6A9;
                text-align:center;

                font-size:25px;
                font-family: Perpetua;
            }

            /*Millor display del scroll. Fa que desapareixi al passar per sota la barra de busqueda*/
            .div_top_scroll_invisible{
                position:sticky;
                background-color: #8FD14F;
                left: 10%;
                right: 10%;
                top: 0%;
                bottom: 80%;
                z-index: 2;
            }

            .label_typo1{
                font-size:17.5px;
                font-family: Perpetua;
            }
            .label_typo2{
                font-size:20px;
                font-family: Impact;
            }


    </style>
</head>

<!-- optional colors
    D2FF72  (lime)
    F6E96B  (sand yellow)
    8FD14F  (grass green)
-->

<body>
    <div class="div_menu_bar">
        <h1>${ConnectedUser.Name}</h1>
        <a class="button_to_home" href="@{Home()}">HOME</a>
    </div>


    #{form @Profile(), id:'formProfile'}
    <p style="display:inline;">

    </p>
    <div class="div_black">
        <div class="div_options">
            <p>
                <a class="button_options" style="top:10%;" onclick="openFormPassword()">CHANGE PASSWORD</a>
            </p>
            <br>
            <p>
                <button class="button_options" type="submit" style="top:30%; border:none;" onclick="logoutUser()">LOG OUT</button>
                <input style="display:none;" type="text" id="logout_confirm" name="do_logout"/>
            </p>
            <br>
            <p>
                <a class="button_options" style="top:50%; background-color: red;" onclick="openFormDelete()">DELETE ACCOUNT</a>
            </p>
            <br>
        </div>
    </div>

    <div class="div_stats">

        <div class="div_label_stats" style="top:5%;">
            <label class="label_stats">${ConnectedUser.Name}</label>
        </div>
        <label class="label_params" style="top:5%;">Name</label>

        <div class="div_label_stats" style="top:15%;">
            <label class="label_stats">${ConnectedUser.Password}</label>
        </div>
        <label class="label_params" style="top:15%;">Password</label>

        <div class="div_label_stats" style="top:25%;">
            <label class="label_stats">${ConnectedUser.numberTimesRent}</label>
        </div>
        <label class="label_params" style="top:25%;">Times Rented</label>

        <div class="div_label_stats" style="top:35%;">
            <label class="label_stats">${ConnectedUser.numberTimesTenant}</label>
        </div>
        <label class="label_params" style="top:35%;">Times Tenant</label>

        <a class="button_show_spaces" style="top:50%;" onclick="openSpacesRented()">RENTED SPACES</a>

        <a class="button_show_spaces" style="top:65%;" onclick="openSpacesTenant()">TENANT SPACES</a>

    </div>

    <div class="form-popup_PASSWORD" id="myFormPassword">
        <form class="form-container_PASSWORD">
            <label class="question">Write your new password, please:</label> <br>
            <input class="input_password" type="password" id="password"/> <br>

            <label class="question">Confirm your new password:</label> <br>
            <input class="input_password" type="password" id="password_check"/> <br>
            <label class="question" id="check_password" style="color: red; display:none;">Check your new password matches the confirmation</label> <br>

            <button type="submit" class="btn" onclick="updateUser(event)">CONFIRM</button>
            <button type="button" class="btn cancel" onclick="closeFormPassword()">CANCEL</button>

            <input style="display:none;" type="text" id="password_confirm" name="do_update"/>
            <input style="display:none;" type="text" id="password_value" name="new_password"/>
        </form>
    </div>

    <div class="form-popup_DELETE" id="myFormDelete">
        <form class="form-container_DELETE">
            <label class="question">Are you sure you want to delete your account?</label>

            <button type="submit" class="btn" onclick="deleteUser()">DELETE</button>
            <button type="button" class="btn cancel" onclick="closeFormDelete()">CANCEL</button>

            <input style="display:none;" type="text" id="delete_confirm" name="do_delete"/>
        </form>
    </div>

    <div id="container_rented" class="div_container">

        <div class="div_top_scroll_invisible">
            <div class="div_inputs_search">
                <label class="label_typo2" style="text-align:center;">SPACES - RENTED</label>
            </div>
        </div>

        #{if spaces_rented}
        <table class="table_containers">
            <tr >
                <th></th>
            </tr>

            #{list items:spaces_rented, as:'space'}
            <tr>
                <td>
                    <div class="div_space_cover">
                        <div class="div_border"></div>
                        <div class="div_picture" about="url(${space.imagepath});" style="background: url(${space.imagepath}); background-size: cover;
                             background-repeat: no-repeat; background-position: center; ">
                        </div>
                        <label class="label_typo1 label_location_space">${space.location}</label>
                        <label class="label_typo1 label_date_space">${space.date}</label>
                        <label class="label_typo1 label_people_space">${space.numberPeople} PEOPLE</label>
                        <label style="display: none;">${space.schedule_start} - ${space.schedule_end}</label>
                        <label style="display: none;">${space.schedule}</label>
                        <label style="display: none;">${space.iden}</label>
                    </div>
                </td>
            </tr>
            #{/list}
        </table>
        #{/if}
    </div>

    <div id="container_tenant" class="div_container">

        <div class="div_top_scroll_invisible">
            <div class="div_inputs_search">
                <label class="label_typo2" style="text-align:center;">SPACES - TENANT</label>
            </div>
        </div>

        #{if spaces_tenant}
        <table class="table_containers">
            <tr>
                <th></th>
            </tr>

            #{list items:spaces_tenant, as:'space'}
            <tr style="border: 1px solid black  ;">
                <td >
                    <div class="div_space_cover">
                        <div    class="div_border"></div>
                        <div class="div_picture" about="url(${space.imagepath});" style="background: url(${space.imagepath}); background-size: cover;
                             background-repeat: no-repeat; background-position: center; ">
                        </div>
                        <label class="label_typo1 label_location_space">${space.location}</label>
                        <label class="label_typo1 label_date_space">${space.date}</label>
                        <label class="label_typo1 label_people_space">${space.numberPeople} PEOPLE</label>
                        <label style="display: none;">${space.schedule_start} - ${space.schedule_end}</label>
                        <label style="display: none;">${space.schedule}</label>
                        <label style="display: none;">${space.iden}</label>
                    </div>
                </td>
            </tr>
            #{/list}
        </table>
        #{/if}
    </div>

    #{/form}

    <script>

        function openFormPassword() {
            document.getElementById("myFormPassword").style.display = "block";
            document.getElementById("myFormDelete").style.display = "none";
            document.getElementById("container_rented").style.display = "none";
            document.getElementById("container_tenant").style.display = "none";
        }

        function closeFormPassword() {
            document.getElementById("myFormPassword").style.display = "none";
        }

        function openFormDelete() {
            document.getElementById("myFormDelete").style.display = "block";
            document.getElementById("myFormPassword").style.display = "none";
            document.getElementById("container_rented").style.display = "none";
            document.getElementById("container_tenant").style.display = "none";
        }

        function closeFormDelete() {
            document.getElementById("myFormDelete").style.display = "none";
        }

        function updateUser(event) {
            var p = document.getElementById("password").value;
            var pc = document.getElementById("password_check").value;

            if((p == pc) && (p != "") && (pc != ""))
            {
                document.getElementById("password_confirm").value = "true";
                document.getElementById("password_value").value = p;
            }
            else
            {
                document.getElementById("check_password").style.display = "block";
                event.preventDefault();
            }
        }

        function deleteUser() {
            document.getElementById("delete_confirm").value = "true";
        }

        function logoutUser(){
             document.getElementById("logout_confirm").value = "true";
        }

        function openSpacesRented() {
            document.getElementById("container_rented").style.display = "block";
            document.getElementById("container_tenant").style.display = "none";
            document.getElementById("myFormPassword").style.display = "none";
            document.getElementById("myFormDelete").style.display = "none";
        }

        function openSpacesTenant() {
            document.getElementById("container_tenant").style.display = "block";
            document.getElementById("container_rented").style.display = "none";
            document.getElementById("myFormPassword").style.display = "none";
            document.getElementById("myFormDelete").style.display = "none";
        }

    </script>


</body>
</html>
